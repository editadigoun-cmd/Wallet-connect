name: Apply withdrawal and fees fix

on:
  push:
    paths:
      - '.github/workflows/fix-withdrawal-fees-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated withdrawal and UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('backend/walletapi/index.js')
          s = backend.read_text()

          old = 'const [deposit,payout]=await Promise.all([availableProviders(country,"DEPOSIT"),availableProviders(country,"PAYOUT")]);return json({ok:true,country,currency:(deposit[0]?.currency||payout[0]?.currency||COUNTRY_CURRENCY[country]||DEFAULT_CURRENCY),depositProviders:deposit,payoutProviders:payout});'
          new = 'const results=await Promise.allSettled([availableProviders(country,"DEPOSIT"),availableProviders(country,"PAYOUT")]);const deposit=results[0].status==="fulfilled"?results[0].value:[];const payout=results[1].status==="fulfilled"?results[1].value:[];if(results[0].status==="rejected")console.error("DEPOSIT_PROVIDER_DISCOVERY_ERROR",results[0].reason);if(results[1].status==="rejected")console.error("PAYOUT_PROVIDER_DISCOVERY_ERROR",results[1].reason);return json({ok:true,country,currency:(deposit[0]?.currency||payout[0]?.currency||COUNTRY_CURRENCY[country]||DEFAULT_CURRENCY),depositProviders:deposit,payoutProviders:payout});'
          if old not in s:
              raise SystemExit('providers route pattern not found')
          s=s.replace(old,new,1)

          old = 'const currency=selected.currency||COUNTRY_CURRENCY[country]||DEFAULT_CURRENCY;const payoutConfig=operationType(selected,"PAYOUT")||{};'
          new = 'const currency=selected.currency||COUNTRY_CURRENCY[country]||DEFAULT_CURRENCY;const feeAmount=0;const payoutConfig=operationType(selected,"PAYOUT")||{};'
          if old not in s:
              raise SystemExit('withdraw fee insertion point not found')
          s=s.replace(old,new,1)

          old = 'VALUES($1,$2,$3,0,$4,$5,\'processing\',\'mobile_money\',$6,$7,$8,$9) RETURNING *`,[ref,w.rows[0].id,amount,currency,provider,phone,JSON.stringify({provider,country}),key,providerReference]'
          new = 'VALUES($1,$2,$3,$4,$5,$6,\'processing\',\'mobile_money\',$7,$8,$9) RETURNING *`,[ref,w.rows[0].id,amount,feeAmount,currency,provider,phone,JSON.stringify({provider,country,fee_type:"none",fee_rate:0,fee_amount:0,net_amount:amount}),key,providerReference]'
          if old not in s:
              raise SystemExit('withdraw insert pattern not found')
          s=s.replace(old,new,1)

          old = 'return json({ok:false,error:"PawaPay a refusé le retrait",details:p.data},502);'
          new = 'return json({ok:false,error:"Le retrait n\'a pas été accepté. Ton solde a été restauré.",code:"WITHDRAWAL_REJECTED",details:p.data},502);'
          if old not in s:
              raise SystemExit('withdraw error message pattern not found')
          s=s.replace(old,new,1)
          backend.write_text(s)

          html=Path('index.html')
          h=html.read_text()
          h=h.replace('Le transfert réel sera exécuté par le backend sécurisé. Aucun secret PawaPay n\'est stocké dans cette interface.','Ton envoi est traité de manière sécurisée.')
          h=h.replace('Version MVP • Architecture prévue pour une application mobile native et un backend sécurisé.','Paiements sécurisés et protection de tes informations.')
          h=h.replace('<div class="field"><label>Moyen de paiement</label><div id="topupProviders" class="provider-grid"></div><select id="topupProvider" class="provider-select" aria-hidden="true" tabindex="-1"><option value="">Sélectionner</option></select></div>\n      <button class="primary" type="submit">Continuer</button>', '<div class="field"><label>Moyen de paiement</label><div id="topupProviders" class="provider-grid"></div><select id="topupProvider" class="provider-select" aria-hidden="true" tabindex="-1"><option value="">Sélectionner</option></select></div>\n      <div class="mini-stat"><div><strong>Frais de service</strong><span>7 % du montant</span></div><strong id="topupFee">0 XOF</strong></div>\n      <div class="mini-stat"><div><strong>Total débité</strong><span>Montant + frais</span></div><strong id="topupTotal">0 XOF</strong></div>\n      <button class="primary" type="submit">Continuer</button>')
          h=h.replace('<div class="field"><label>Moyen de retrait</label><div id="withdrawProviders" class="provider-grid"></div><select id="withdrawProvider" class="provider-select" aria-hidden="true" tabindex="-1"><option value="">Sélectionner</option></select></div>\n      <button class="secondary" type="submit">Continuer</button>\n    </form>\n  </div>\n  <div class="notice">Les frais et le montant net sont affichés avant la confirmation lorsque la configuration du pays les définit.</div>', '<div class="field"><label>Moyen de retrait</label><div id="withdrawProviders" class="provider-grid"></div><select id="withdrawProvider" class="provider-select" aria-hidden="true" tabindex="-1"><option value="">Sélectionner</option></select></div>\n      <div class="mini-stat"><div><strong>Frais de retrait</strong><span>Frais Wallet Connect</span></div><strong id="withdrawFeeDetail">0 XOF</strong></div>\n      <div class="mini-stat"><div><strong>Montant reçu</strong><span>Somme envoyée vers Mobile Money</span></div><strong id="withdrawNet">0 XOF</strong></div>\n      <button class="secondary" type="submit">Continuer</button>\n    </form>\n  </div>\n  <div class="notice">Aucun frais n’est ajouté au retrait. Le montant affiché correspond au montant reçu.</div>')
          html.write_text(h)

          wallet=Path('web/src/features/wallet.js')
          w=wallet.read_text()
          w=w.replace('if(!window.confirm("Confirmer la recharge de "+amount.toLocaleString("fr-FR")+" ?"))return;', 'const fee=Math.round(amount*0.07);const total=amount+fee;if(!window.confirm("Confirmer la recharge de "+amount.toLocaleString("fr-FR")+" ?\\n\\nFrais de service : "+fee.toLocaleString("fr-FR")+"\\nTotal débité : "+total.toLocaleString("fr-FR")))return;')
          w=w.replace('if(!window.confirm("Confirmer le retrait de "+amount.toLocaleString("fr-FR")+" ?"))return;', 'if(!window.confirm("Confirmer le retrait de "+amount.toLocaleString("fr-FR")+" ?\\n\\nFrais de retrait : 0\\nMontant reçu : "+amount.toLocaleString("fr-FR")))return;')
          marker='export function initWallet({toast,refresh}){'
          inject='''export function initWallet({toast,refresh}){\n  const updateFeeSummaries=()=>{\n    const amount=Number(document.getElementById("topupAmount")?.value||0);\n    const currency=window.__walletState?.meData?.currency||"XOF";\n    const fee=Math.round(amount*0.07);\n    const topupFee=document.getElementById("topupFee");\n    const topupTotal=document.getElementById("topupTotal");\n    if(topupFee)topupFee.textContent=fee.toLocaleString("fr-FR")+" "+currency;\n    if(topupTotal)topupTotal.textContent=(amount+fee).toLocaleString("fr-FR")+" "+currency;\n    const withdrawalAmount=Number(document.getElementById("withdrawAmount")?.value||0);\n    const withdrawFee=document.getElementById("withdrawFeeDetail");\n    const withdrawNet=document.getElementById("withdrawNet");\n    if(withdrawFee)withdrawFee.textContent="0 "+currency;\n    if(withdrawNet)withdrawNet.textContent=withdrawalAmount.toLocaleString("fr-FR")+" "+currency;\n  };\n  document.getElementById("topupAmount")?.addEventListener("input",updateFeeSummaries);\n  document.getElementById("withdrawAmount")?.addEventListener("input",updateFeeSummaries);\n  updateFeeSummaries();'''
          if marker not in w: raise SystemExit('wallet init marker not found')
          w=w.replace(marker,inject,1)
          wallet.write_text(w)
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check backend/walletapi/index.js
          node --check web/src/features/wallet.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/walletapi/index.js index.html web/src/features/wallet.js
          git diff --cached --check
          git commit -m 'Fix withdrawal provider isolation and display fees'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-withdrawal-fees-ui.yml
          git commit -m 'Remove temporary fix workflow'
          git push
