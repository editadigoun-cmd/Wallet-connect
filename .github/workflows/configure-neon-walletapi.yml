name: Deploy Wallet Connect backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/walletapi/**'
      - '.github/workflows/configure-neon-walletapi.yml'

jobs:
  deploy-neon-function:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PAWAPAY_API_TOKEN: ${{ secrets.PAWAPAY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neon CLI
        run: npm install -g neon@latest

      - name: Check backend syntax
        run: node --check backend/walletapi/index.js

      - name: Deploy Wallet Connect API to Neon
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"
          test -n "$PAWAPAY_API_TOKEN"
          neon functions deploy walletapi \
            --project-id green-violet-58373553 \
            --branch br-fragrant-moon-b4qxibei \
            --src backend/walletapi/index.js \
            --env "PAWAPAY_API_TOKEN=$PAWAPAY_API_TOKEN" \
            --env "PAWAPAY_CORRESPONDENT=MTN_MOMO_COG"

      - name: Verify deployed function health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 8 --retry-delay 2 "https://br-fragrant-moon-b4qxibei-walletapi.compute.c-6.us-east-2.aws.neon.tech/health"
