name: Configure Wallet Connect Neon Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-neon-walletapi.yml'

jobs:
  configure-neon-function:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PAWAPAY_API_TOKEN: ${{ secrets.PAWAPAY_API_TOKEN }}
    steps:
      - name: Inject PawaPay production secret into existing Neon Function
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"
          test -n "$PAWAPAY_API_TOKEN"
          ENV_JSON=$(jq -cn --arg token "$PAWAPAY_API_TOKEN" '{PAWAPAY_API_TOKEN:$token}')
          BODY=$(jq -cn --arg env "$ENV_JSON" '{environment:$env}')
          curl --fail-with-body -sS -X POST \
            "https://console.neon.tech/api/v2/projects/green-violet-58373553/branches/br-fragrant-moon-b4qxibei/functions/walletapi/deployments" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY"
