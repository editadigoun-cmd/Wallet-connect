name: Configure Wallet Connect Neon Function

on:
  workflow_dispatch:

jobs:
  configure-neon-function:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PAWAPAY_API_TOKEN: ${{ secrets.PAWAPAY_API_TOKEN }}
    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl

      - name: Inject PawaPay production secret into Neon Function
        run: |
          test -n "$NEON_API_KEY"
          test -n "$PAWAPAY_API_TOKEN"
          neonctl functions deploy walletapi \
            --project-id green-violet-58373553 \
            --branch br-fragrant-moon-b4qxibei \
            --api-key "$NEON_API_KEY" \
            --env "PAWAPAY_API_TOKEN=$PAWAPAY_API_TOKEN"
