name: Fix orphaned Wallet Connect profiles

on:
  push:
    branches:
      - main
    paths:
      - backend/walletapi/index.js
      - scripts/fix_profile.py
      - .github/workflows/fix-profile-link.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile recovery patch
        run: python3 scripts/fix_profile.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/walletapi/index.js
          git diff --cached --quiet || git commit -m 'Fix profile recovery after signup'
          git push
