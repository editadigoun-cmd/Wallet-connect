name: One-time PawaPay base fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pawapay-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: use v1 active-conf with v2 availability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active configuration endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/walletapi/index.js')
          s=p.read_text()
          if 'const PAWAPAY_V1_BASE' not in s:
              s=s.replace('const PAWAPAY_BASE = "https://api.pawapay.io/v2";','const PAWAPAY_BASE = "https://api.pawapay.io/v2";\nconst PAWAPAY_V1_BASE = "https://api.pawapay.io";')
          if 'async function pawapayV1(' not in s:
              marker='async function availableProviders(country,kind){'
              helper='async function pawapayV1(path,method,payload){const token=process.env.PAWAPAY_API_TOKEN;if(!token)throw new Error("PawaPay non configuré");const r=await fetch(PAWAPAY_V1_BASE+path,{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:payload===undefined?undefined:JSON.stringify(payload),signal:AbortSignal.timeout(30000)});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={raw:text}}return{ok:r.ok,status:r.status,data}}\n'
              s=s.replace(marker,helper+marker)
          s=s.replace('const active=await pawapay("/active-conf","GET");','const active=await pawapayV1("/active-conf","GET");')
          p.write_text(s)
          PY
          node --check backend/walletapi/index.js
      - name: Commit backend fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/walletapi/index.js
          git commit -m 'fix: use v1 active-conf with v2 availability'
          git push
